<!DOCTYPE html>
<html lang="ur" dir="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>طاہر عباس — Lucky Draw</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .header {
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .brand { font-size: 26px; font-weight: 800; color: #fbbf24; margin: 4px 0; }
    .sub { color: #94a3b8; font-size: 14px; margin: 0; }
    h2 { font-size: 18px; margin: 0 0 12px; color: #38bdf8; }
    .tiers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tier {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
    }
    .tier.active { border-color: #fbbf24; background: #292524; }
    .tier-title { font-weight: 700; font-size: 15px; }
    .tier-price { color: #fbbf24; font-weight: 700; margin-top: 4px; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin: 10px 0 4px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
    }
    button {
      margin-top: 14px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #fbbf24;
      color: #0f172a;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
    button.secondary { background: #334155; color: #f8fafc; margin-top: 8px; }
    button.danger { background: #dc2626; color: #fff; margin-top: 8px; }
    .slip {
      background: #0f172a;
      border: 1px dashed #fbbf24;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }
    .muted { color: #94a3b8; font-size: 13px; }
    .hidden { display: none; }
    #errBox {
      display: none;
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #f87171;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="errBox"></div>

    <div class="card header" id="brandHeader" title="Admin ke liye 5 baar tap karein">
      <div class="brand">طاہر عباس</div>
      <p class="sub">Lucky Draw Entry &amp; Slip Portal</p>
    </div>

    <div class="card">
      <h2>1. Prize Tier Chunein</h2>
      <div class="tiers" id="tiersBox"></div>
    </div>

    <div class="card">
      <h2>2. Payment Accounts</h2>
      <div id="accountsBox" class="muted"></div>
    </div>

    <div class="card">
      <h2>3. Entry Slip Banayein</h2>
      <label for="userName">Poora Naam</label>
      <input id="userName" type="text" placeholder="Apna naam likhein" />

      <label for="userPhone">Phone / WhatsApp Number</label>
      <input id="userPhone" type="text" placeholder="03xx / +9665x..." />

      <label for="payMethod">Payment Method</label>
      <select id="payMethod"></select>

      <label for="trxId">Transaction ID / Reference</label>
      <input id="trxId" type="text" placeholder="Trx ID ya receipt number" />

      <button id="submitBtn" type="button">Generate Slip</button>
      <div id="latestSlip"></div>
    </div>

    <div class="card">
      <h2>Meri Slips</h2>
      <div id="slipsList" class="muted">Abhi koi slip darj nahi hai.</div>
    </div>

    <div class="card hidden" id="adminPanel">
      <h2>Admin Panel (PIN: 10203040)</h2>
      <label for="adminAccounts">Payment Accounts (har line aik account)</label>
      <input id="adminAccounts" type="text" />

      <button id="saveAdminBtn" type="button">Save Settings</button>
      <button id="clearSlipsBtn" type="button" class="danger">Clear All Slips</button>
      <button id="closeAdminBtn" type="button" class="secondary">Close Admin</button>
    </div>
  </div>

  <script>
    (function () {
      const errBox = document.getElementById("errBox");
      window.addEventListener("error", function (e) {
        errBox.style.display = "block";
        errBox.textContent = "Error: " + (e.message || "Unknown error");
      });

      const STORAGE_KEY = "tahir_abbas_lucky_draw_v1";
      const ADMIN_PIN = "10203040";

      const defaultTiers = [
        { id: "mobile", name: "Mobile Phone Draw", fee: "100 SAR" },
        { id: "laptop", name: "Laptop Draw", fee: "200 SAR" }
      ];

      const defaultState = {
        selectedTierId: "mobile",
        accounts: ["JazzCash / Easypaisa", "Bank / Wallet Transfer"],
        slips: []
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return structuredClone(defaultState);
          const parsed = JSON.parse(raw);
          return {
            selectedTierId: parsed.selectedTierId || "mobile",
            accounts: Array.isArray(parsed.accounts) && parsed.accounts.length ? parsed.accounts : defaultState.accounts.slice(),
            slips: Array.isArray(parsed.slips) ? parsed.slips : []
          };
        } catch (e) {
          return structuredClone(defaultState);
        }
      }

      let state = loadState();

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          errBox.style.display = "block";
          errBox.textContent = "Storage save error: " + e.message;
        }
      }

      function renderAll() {
        const tiersBox = document.getElementById("tiersBox");
        tiersBox.innerHTML = "";
        defaultTiers.forEach(function (t) {
          const div = document.createElement("div");
          div.className = "tier" + (state.selectedTierId === t.id ? " active" : "");
          div.innerHTML = '<div class="tier-title">' + t.name + '</div><div class="tier-price">' + t.fee + '</div>';
          div.addEventListener("click", function () {
            state.selectedTierId = t.id;
            saveState();
            renderAll();
          });
          tiersBox.appendChild(div);
        });

        const accountsBox = document.getElementById("accountsBox");
        const payMethod = document.getElementById("payMethod");
        accountsBox.innerHTML = state.accounts.map(function (acc) { return "<div>• " + acc + "</div>"; }).join("");
        payMethod.innerHTML = state.accounts.map(function (acc) {
          return '<option value="' + acc.replace(/"/g, "&quot;") + '">' + acc + "</option>";
        }).join("");

        const slipsList = document.getElementById("slipsList");
        if (!state.slips.length) {
          slipsList.innerHTML = '<div class="muted">Abhi koi slip darj nahi hai.</div>';
        } else {
          slipsList.innerHTML = state.slips.map(function (s) {
            return (
              '<div class="slip">' +
              "<div><strong>Slip #:</strong> " + s.code + "</div>" +
              "<div><strong>Naam:</strong> " + s.name + " | <strong>Phone:</strong> " + s.phone + "</div>" +
              "<div><strong>Tier:</strong> " + s.tier + " | <strong>Method:</strong> " + s.method + "</div>" +
              "<div><strong>Trx ID:</strong> " + s.trx + "</div>" +
              "</div>"
            );
          }).join("");
        }
      }

      document.getElementById("submitBtn").addEventListener("click", function () {
        const name = document.getElementById("userName").value.trim();
        const phone = document.getElementById("userPhone").value.trim();
        const method = document.getElementById("payMethod").value;
        const trx = document.getElementById("trxId").value.trim();

        if (!name || !phone || !trx) {
          alert("Barah-e-karam naam, phone aur transaction ID darj karein.");
          return;
        }

        const tierObj = defaultTiers.find(function (t) { return t.id === state.selectedTierId; }) || defaultTiers[0];
        const slip = {
          code: "LD-" + Math.floor(100000 + Math.random() * 900000),
          name: name,
          phone: phone,
          tier: tierObj.name + " (" + tierObj.fee + ")",
          method: method,
          trx: trx
        };

        state.slips.unshift(slip);
        saveState();
        renderAll();

        document.getElementById("latestSlip").innerHTML =
          '<div class="slip"><strong>Slip Ban Gayi!</strong> Code: <strong>' + slip.code + "</strong></div>";

        document.getElementById("userName").value = "";
        document.getElementById("userPhone").value = "";
        document.getElementById("trxId").value = "";
      });

      let tapCount = 0;
      let tapTimer = null;
      document.getElementById("brandHeader").addEventListener("click", function () {
        tapCount += 1;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(function () { tapCount = 0; }, 1400);

        if (tapCount >= 5) {
          tapCount = 0;
          const pin = prompt("Admin PIN darj karein:");
          if (pin === ADMIN_PIN) {
            const panel = document.getElementById("adminPanel");
            panel.classList.remove("hidden");
            document.getElementById("adminAccounts").value = state.accounts.join(" | ");
          } else if (pin !== null) {
            alert("Ghalat PIN.");
          }
        }
      });

      document.getElementById("saveAdminBtn").addEventListener("click", function () {
        const val = document.getElementById("adminAccounts").value;
        const list = val.split("|").map(function (x) { return x.trim(); }).filter(Boolean);
        if (list.length) {
          state.accounts = list;
          saveState();
          renderAll();
          alert("Settings save ho gayin.");
        }
      });

      document.getElementById("clearSlipsBtn").addEventListener("click", function () {
        state.slips = [];
        saveState();
        renderAll();
      });

      document.getElementById("closeAdminBtn").addEventListener("click", function () {
        document.getElementById("adminPanel").classList.add("hidden");
      });

      renderAll();
    })();
  </script>
</body>
</html>
